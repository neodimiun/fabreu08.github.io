<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JFA˚ — Materials &amp; Process Technology</title>
  <meta name="description" content="José A. Fernández Abreu, M.S. — M&amp;PT Engineer at Collins Aerospace Landing Systems." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pad-x: clamp(1.25rem, 4.5vw, 5rem);
      --pad-y: clamp(1rem, 3vh, 4rem);
      --header-pt: clamp(1.25rem, 2.5vh, 2.5rem);
      --gap-nav: clamp(1rem, 2.2vw, 2.25rem);
      --logo: clamp(1.35rem, 1.2vw + 0.9rem, 2.1rem);
      --logo-deg: clamp(0.65rem, 0.4vw + 0.45rem, 0.9rem);
      --nav: clamp(0.65rem, 0.35vw + 0.5rem, 0.875rem);
      --headline: clamp(2.15rem, 4.5vw + 0.75rem, 5.25rem);
      --body: clamp(0.7rem, 0.35vw + 0.55rem, 0.9rem);
      --micro: clamp(0.55rem, 0.25vw + 0.45rem, 0.7rem);
      --btn-px: clamp(1.15rem, 1.4vw, 1.75rem);
      --btn-py: clamp(0.6rem, 0.9vh, 0.85rem);
      --feature-pad: clamp(1rem, 1.5vw, 1.75rem);
      --feature-min: clamp(13rem, 18vw, 20rem);
      --globe: clamp(2.25rem, 2.5vw + 1rem, 3.25rem);
      --checker-w: clamp(2.75rem, 4.5vw, 6.5rem);
      --checker-h: clamp(1.35rem, 2.2vw, 3rem);
      --corner: clamp(0.65rem, 0.4vw + 0.4rem, 0.95rem);
      --icon: clamp(1rem, 0.6vw + 0.7rem, 1.35rem);
      --drawer-pad: clamp(1.25rem, 2.5vw, 2.25rem);
      --drawer-max: clamp(18rem, 28vw, 28rem);
      --section-gap: clamp(0.75rem, 1.5vh, 1.5rem);
      --main-py: clamp(1.25rem, 4vh, 4rem);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #000;
      font-family: 'Plus Jakarta Sans', sans-serif;
      antialiased: true;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: #000; color: #fff; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }

    .page { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }

    .image-reveal {
      display: none;
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    @media (min-width: 1024px) { .image-reveal { display: block; } }
    .bg-base, .bg-reveal {
      position: absolute; inset: 0;
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .bg-base { background-image: url('media/bg-1.jpg'); }
    .bg-reveal { background-image: url('media/bg-2.jpg'); }
    .grid-overlay { position: absolute; inset: 0; opacity: 0.10; }

    header {
      position: relative; z-index: 20;
      padding-inline: var(--pad-x);
      padding-top: var(--header-pt);
      padding-bottom: var(--section-gap);
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 0.15em;
      font-size: var(--logo);
      background: none; border: 0; cursor: pointer; color: inherit;
    }
    .logo:hover { opacity: 0.8; }
    .logo sup { font-size: var(--logo-deg); margin-left: 0.125rem; position: relative; top: -0.125rem; }
    nav { display: flex; align-items: center; gap: var(--gap-nav); }
    nav button {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: var(--nav);
      background: none; border: 0; cursor: pointer; color: inherit;
    }
    nav button:hover { opacity: 0.5; }
    .nav-div { color: #9ca3af; }

    main {
      position: relative; z-index: 10; flex: 1;
      padding-inline: var(--pad-x);
      padding-block: var(--main-py);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    @media (min-width: 1024px) {
      main { flex-direction: row; justify-content: space-between; align-items: stretch; }
    }

    .hero-left { display: flex; flex-direction: column; justify-content: center; max-width: 36rem; }
    .brackets { display: flex; }
    .headline {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.05;
      font-size: var(--headline);
      margin: 0.35rem 0;
    }
    .headline-row { display: flex; align-items: flex-end; gap: 0.55rem; }
    .cta {
      margin-top: 1.25rem; align-self: flex-start;
      border: 1px solid #9ca3af; border-radius: 0.375rem;
      text-transform: uppercase; letter-spacing: 0.18em;
      font-size: var(--body); font-weight: 600;
      padding: var(--btn-py) var(--btn-px);
      background: #fff; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.45rem;
    }
    .cta:hover { background: #000; color: #fff; border-color: #000; }
    .cta:hover .arrow { transform: translate(2px, -2px); }
    .arrow { transition: transform 0.2s ease; width: var(--icon); height: var(--icon); }

    .hero-right { align-self: flex-end; min-width: var(--feature-min); padding: var(--feature-pad); position: relative; }
    .hero-right p {
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em;
      font-size: var(--body); margin-top: 0.75rem;
    }
    .corner { position: absolute; width: var(--corner); height: var(--corner); }

    .mobile-shot {
      display: block; margin: 0 var(--pad-x) var(--pad-y);
      border: 1px solid #e5e7eb; overflow: hidden;
      aspect-ratio: 4 / 5;
      background: url('media/bg-1.jpg') center/cover no-repeat;
    }
    @media (min-width: 640px) { .mobile-shot { aspect-ratio: 16 / 9; } }
    @media (min-width: 1024px) { .mobile-shot { display: none; } }

    .drawer-root { position: fixed; inset: 0; z-index: 40; }
    .drawer-root[hidden] { display: none !important; }
    .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(2px); }
    .drawer {
      position: absolute; top: 0; right: 0; height: 100%;
      width: min(100%, var(--drawer-max));
      background: #fff; border-left: 1px solid #e5e7eb;
      padding: var(--drawer-pad);
      transform: translateX(100%);
      transition: transform 0.28s ease;
      overflow: auto;
    }
    .drawer-root.open .drawer { transform: none; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .drawer-head h2 {
      font-family: 'Orbitron', sans-serif; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em; font-size: 1.05rem;
    }
    .drawer-close { background: none; border: 0; cursor: pointer; font-size: 1.25rem; line-height: 1; }
    .drawer-body { font-size: var(--body); line-height: 1.7; color: #111; }
    .drawer-body .sub { font-size: var(--micro); letter-spacing: 0.16em; text-transform: uppercase; color: #6b7280; margin-bottom: 0.85rem; }
    .drawer-body p { margin-bottom: 0.85rem; }
    .drawer-body ul { list-style: none; margin-top: 1rem; }
    .drawer-body li { border-top: 1px solid #e5e7eb; padding: 0.45rem 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: var(--micro); }
    .drawer-foot {
      margin-top: 2rem; text-align: center; color: #6b7280;
      font-size: var(--micro); letter-spacing: 0.14em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="image-reveal" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-reveal"></div>
    <svg class="grid-overlay" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
          <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width="0.6"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#gridPattern)" />
    </svg>
  </div>

  <div class="page">
    <header>
      <button class="logo" type="button">JFA<sup>˚</sup></button>
      <nav>
        <button type="button" data-drawer="aerospace">Aerospace</button>
        <button type="button" data-drawer="chemistry">Chemistry</button>
        <button type="button" data-drawer="micro">Micro</button>
        <span class="nav-div">|</span>
        <button type="button" data-drawer="systems">Systems</button>
      </nav>
    </header>

    <main>
      <div class="hero-left">
        <svg class="corner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 11.5V0.5H11.5"/></svg>
        <h1 class="headline">
          Materials<br />
          Process<br />
          <span class="headline-row">
            Technology
            <svg width="36" height="18" viewBox="0 0 36 18" style="width:var(--checker-w);height:var(--checker-h);transform:translateY(2px)" aria-hidden="true">
              <g fill="#000">
                <rect x="0" y="0" width="3.8" height="3.8"/><rect x="7.6" y="0" width="3.8" height="3.8"/><rect x="15.2" y="0" width="3.8" height="3.8"/><rect x="22.8" y="0" width="3.8" height="3.8"/>
                <rect x="2.25" y="4.6" width="3.8" height="3.8"/><rect x="9.85" y="4.6" width="3.8" height="3.8"/><rect x="17.45" y="4.6" width="3.8" height="3.8"/><rect x="25.05" y="4.6" width="3.8" height="3.8"/>
                <rect x="0" y="9.2" width="3.8" height="3.8"/><rect x="7.6" y="9.2" width="3.8" height="3.8"/><rect x="15.2" y="9.2" width="3.8" height="3.8"/><rect x="22.8" y="9.2" width="3.8" height="3.8"/>
                <rect x="2.25" y="13.8" width="3.8" height="3.8"/><rect x="9.85" y="13.8" width="3.8" height="3.8"/><rect x="17.45" y="13.8" width="3.8" height="3.8"/><rect x="25.05" y="13.8" width="3.8" height="3.8"/>
              </g>
            </svg>
          </span>
        </h1>
        <svg class="corner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 0.5V11.5H11.5"/></svg>
        <button class="cta" type="button" data-drawer="aerospace">
          Read profile
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </button>
      </div>

      <aside class="hero-right">
        <svg class="corner" style="top:0;left:0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 11.5V0.5H11.5"/></svg>
        <svg class="corner" style="top:0;right:0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0.5 0.5H11.5V11.5"/></svg>
        <svg class="corner" style="bottom:0;left:0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 0.5V11.5H11.5"/></svg>
        <svg class="corner" style="bottom:0;right:0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0.5 11.5H11.5V0.5"/></svg>
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" style="width:var(--globe);height:var(--globe)">
          <circle cx="32" cy="32" r="28"/>
          <ellipse cx="32" cy="32" rx="28" ry="12"/>
          <ellipse cx="32" cy="32" rx="28" ry="20"/>
          <line x1="32" y1="4" x2="32" y2="60"/>
          <ellipse cx="32" cy="32" rx="12" ry="28"/>
          <ellipse cx="32" cy="32" rx="20" ry="28"/>
        </svg>
        <p>M&amp;PT Engineer.<br />Collins Landing Systems.</p>
      </aside>
    </main>
  </div>

  <div class="mobile-shot" role="img" aria-label="Landing gear study"></div>

  <div class="drawer-root" id="drawerRoot" hidden>
    <div class="backdrop"></div>
    <aside class="drawer" id="drawerPanel">
      <div class="drawer-head">
        <h2 id="drawerTitle">Profile</h2>
        <button class="drawer-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <p class="drawer-foot">JFA © 2026 — Materials Process Technology</p>
    </aside>
  </div>

  <script type="module">
    import { initReveal, initDrawers } from './js/reveal.js';
    initDrawers();
    if (window.matchMedia('(min-width: 1024px)').matches) initReveal();
  </script>
</body>
</html>
